<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>কাদুটি উচ্চ বিদ্যালয় — রোল অনুযায়ী ফলাফল পোর্টাল</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(18, 25, 42, 0.88);
      --surface-light: #ffffff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --border: rgba(148, 163, 184, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top, #132238 0%, var(--bg-dark) 65%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 14px 48px;
      line-height: 1.6;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .header-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 20px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(1.5rem, 3.2vw, 2.2rem);
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.98rem;
      margin-bottom: 12px;
    }

    .quick-link {
      display: inline-block;
      color: var(--accent);
      font-weight: 600;
      text-decoration: underline;
      font-size: 0.96rem;
    }

    .search-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 24px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.28);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 0.92rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .field select,
    .field input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field select:focus,
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 22px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #04101c;
    }

    .btn-secondary {
      background: rgba(148, 163, 184, 0.16);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .btn-print {
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: #052e16;
    }

    .hint-text {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .status-msg {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      display: none;
    }

    .status-error {
      display: block;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fecaca;
    }

    .status-info {
      display: block;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #bae6fd;
    }

    .marksheet-wrapper {
      display: none;
      background: var(--surface-light);
      color: #0f172a;
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      border: 2px solid #0f172a;
    }

    .marksheet-wrapper.active {
      display: block;
    }

    .sheet-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      border-bottom: 2px solid #0
