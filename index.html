<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>কাদুটি উচ্চ বিদ্যালয় — ফলাফল পোর্টাল</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px 14px;
    }
    .box {
      max-width: 820px;
      margin: 0 auto 20px;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    h1, h2 { margin-top: 0; }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    select, input, button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      font-size: 16px;
    }
    select, input {
      background: #0f172a;
      color: #ffffff;
      flex: 1;
      min-width: 160px;
    }
    button {
      background: #38bdf8;
      color: #082f49;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    .sheet {
      display: none;
      max-width: 820px;
      margin: 0 auto;
      background: #ffffff;
      color: #0f172a;
      padding: 24px;
      border-radius: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
    }
    th, td {
      border: 1px solid #cbd5e1;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #0f172a;
      color: #ffffff;
    }
    .msg {
      margin-top: 10px;
      color: #fca5a5;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>কাদুটি উচ্চ বিদ্যালয়</h1>
    <p>কাদুটি, চান্দিনা, কুমিল্লা — ৬ষ্ঠ শ্রেণির ফলাফল যাচাই</p>
    <form id="searchForm">
      <div class="row">
        <select id="section">
          <option value="">শাখা নির্বাচন করুন</option>
          <option value="ক">ক শাখা</option>
          <option value="খ">খ শাখা</option>
          <option value="গ">গ শাখা</option>
        </select>
        <input type="text" id="roll" placeholder="রোল লিখুন (যেমন: 1)" />
        <button type="submit">ফলাফল দেখুন</button>
      </div>
    </form>
    <div id="msg" class="msg"></div>
  </div>

  <div id="sheet" class="sheet">
    <h2>একাডেমিক ফলাফল বিবরণী</h2>
    <p><strong>নাম:</strong> <span id="mName"></span> | <strong>আইডি:</strong> <span id="mId"></span></p>
    <p><strong>শ্রেণি:</strong> ৬ষ্ঠ | <strong>শাখা:</strong> <span id="mSec"></span> | <strong>রোল:</strong> <span id="mRoll"></span></p>
    <table>
      <thead>
        <tr>
          <th>বিষয়</th>
          <th>নম্বর</th>
        </tr>
      </thead>
      <tbody id="mRows"></tbody>
    </table>
    <p style="margin-top:14px;">
      <strong>মোট:</strong> <span id="mTotal"></span> |
      <strong>গড়:</strong> <span id="mAvg"></span> |
      <strong>GPA:</strong> <span id="mGpa"></span> |
      <strong>গ্রেড:</strong> <span id="mGrade"></span>
    </p>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-mHQ364DffZpB4vjuoiU0IVb9JTyPiHR2QKBjmwrP4OEdSe0JY3NKAltXEjWP5KvtqneF5ZiEIO-j/pub?output=csv"; //[cite: 6]

    function cleanNum(v) {
      const bn = "০১২৩৪৫৬৭৮৯";
      return String(v || "").trim().replace(/[০-৯]/g, d => bn.indexOf(d)).replace(/^0+/, "") || "0";
    }

    function parseCsvRows(txt) {
      const lines = txt.replace(/^\uFEFF/, "").trim().split(/\r?\n/).filter(Boolean);
      if (lines.length < 2) return [];
      return lines.slice(1).map(line =>
        line.split(",").map(c => c.replace(/^"|"$/g, "").trim())
      );
    }

    document.getElementById("searchForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const sec = document.getElementById("section").value.trim();
      const roll = cleanNum(document.getElementById("roll").value);
      const msg = document.getElementById("msg");
      const sheet = document.getElementById("sheet");

      if (!sec) {
        msg.textContent = "আগে শাখা নির্বাচন করুন।";
        sheet.style.display = "none";
        return;
      }

      msg.textContent = "খোঁজা হচ্ছে...";

      try {
        const sep = CSV_URL.includes("?") ? "&" : "?";
        const res = await fetch(CSV_URL + sep + "t=" + Date.now());
        if (!res.ok) throw new Error("fetch failed");

        const rows = parseCsvRows(await res.text());
        // col[0]=Student_ID, col[1]=Class, col[2]=Section, col[3]=Roll, col[4]=Student_Name
        const student = rows.find(col =>
          cleanNum(col[1]) === "6" &&
          String(col[2] || "").trim() === sec &&
          cleanNum(col[3]) === roll
        );

        if (!student) {
          msg.textContent = "এই শাখা ও রোলের কোনো ফলাফল পাওয়া যায়নি।";
          sheet.style.display = "none";
          return;
        }

        msg.textContent = "";
        document.getElementById("mId").textContent = student[0] || "-";
        document.getElementById("mSec").textContent = student[2] || "-";
        document.getElementById("mRoll").textContent = student[3] || "-";
        document.getElementById("mName").textContent = student[4] || "-";

        const subjects = [
          ["বাংলা", student[5]],
          ["ইংরেজি", student[6]],
          ["গণিত", student[7]],
          ["বিজ্ঞান", student[8]],
          ["বাংলাদেশ ও বিশ্বপরিচয়", student[9]],
          ["ধর্ম ও নৈতিক শিক্ষা", student[10]]
        ];

        document.getElementById("mRows").innerHTML = subjects
          .map(([sub, mark]) => `<tr><td>${sub}</td><td>${mark || "-"}</td></tr>`)
          .join("");

        document.getElementById("mTotal").textContent = student[11] || "-";
        document.getElementById("mAvg").textContent = student[12] || "-";
        document.getElementById("mGpa").textContent = student[13] || "-";
        document.getElementById("mGrade").textContent = student[14] || "-";
        sheet.style.display = "block";
      } catch (err) {
        msg.textContent = "শিট থেকে ডেটা আনা যাচ্ছে না। একটু পর আবার চেষ্টা করুন।";
        sheet.style.display = "none";
      }
    });
  </script>
</body>
</html>
